name: Robust Eval Suite

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robust-eval-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentai_robust
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentai_robust"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentai_robust
      VECTOR_STORE_PROVIDER: pgvector
      RAG_HYBRID_ENABLED: "true"
      RAG_HYBRID_FUSION: rrf

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Require OpenAI key
        run: test -n "$OPENAI_API_KEY"

      - name: Run robust hard and real eval suite
        run: npm run eval:robust-suite

      - name: Check robust quality gate
        run: npm run robust:gate -- --fail-on-warn

      - name: Upload robust eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robust-eval-reports
          path: |
            server/evaluation/corpora/arxiv-computer-science-rerank-v1.json
            server/evaluation/results/latest.*
            server/evaluation/results/latest-rerank-hard-cs.*
            server/evaluation/results/latest-arxiv-rerank.*
          if-no-files-found: ignore
