name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  server-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      - name: Enforce backend coverage
        run: npm run coverage:gate

  quality-gate:
    runs-on: ubuntu-latest
    env:
      EVAL_EVIDENCE_PROFILE: quality-current
      EVAL_TARGET_COMMIT_SHA: ${{ github.sha }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run current synthetic eval
        if: ${{ !cancelled() }}
        run: npm run eval:synthetic -- evaluation/synthetic-corpus-near-duplicate.json --latest-name latest-quality --openai-provider deterministic

      - name: Run trajectory eval
        if: ${{ !cancelled() }}
        run: npm run eval:trajectory

      - name: Run planner eval (mock)
        if: ${{ !cancelled() }}
        run: npm run eval:planner -- --provider mock

      - name: Run planner eval (real)
        if: ${{ !cancelled() && env.OPENAI_API_KEY != '' }}
        run: npm run eval:planner -- --provider real

      - name: Run recovery observability eval
        if: ${{ !cancelled() }}
        run: npm run eval:recovery-observability

      - name: Run feedback regression eval
        if: ${{ !cancelled() }}
        run: npm run eval:feedback

      - name: Check current quality gate
        if: ${{ !cancelled() && env.OPENAI_API_KEY == '' }}
        run: npm run quality:current -- --target-commit "$EVAL_TARGET_COMMIT_SHA"

      - name: Check current quality gate (planner real)
        if: ${{ !cancelled() && env.OPENAI_API_KEY != '' }}
        run: npm run quality:current -- --target-commit "$EVAL_TARGET_COMMIT_SHA" --require-planner-real

      - name: Upload current quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-quality-${{ env.EVAL_TARGET_COMMIT_SHA }}
          path: |
            server/evaluation/results/latest-quality.*
            server/evaluation/results/latest-feedback.*
            server/evaluation/results/latest-trajectory.*
            server/evaluation/results/latest-planner-mock.*
            server/evaluation/results/latest-planner-real.*
            server/evaluation/results/latest-recovery-observability.*
            server/evaluation/results/latest-current-quality-gate.*
          if-no-files-found: error
