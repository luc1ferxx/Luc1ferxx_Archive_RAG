name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentai_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real pgvector PostgreSQL for the integration suite. The remaining suites
      # pin VECTOR_STORE_PROVIDER themselves; nothing here downgrades the default.
      PGVECTOR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentai_test

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      - name: Enforce backend coverage
        run: npm run coverage:gate

  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentai_quality
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentai_quality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EVAL_EVIDENCE_PROFILE: quality-current
      EVAL_TARGET_COMMIT_SHA: ${{ github.sha }}
      # The current profile runs the default retrieval stack for real:
      # pgvector + dense/sparse routes + RRF. quality:current fails if the
      # reports say otherwise, so these are stated rather than assumed.
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentai_quality
      VECTOR_STORE_PROVIDER: pgvector
      RAG_HYBRID_ENABLED: "true"
      RAG_HYBRID_FUSION: rrf

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run current synthetic eval
        if: ${{ !cancelled() }}
        run: npm run eval:synthetic -- evaluation/synthetic-corpus-near-duplicate.json --latest-name latest-quality --openai-provider deterministic

      - name: Run trajectory eval
        if: ${{ !cancelled() }}
        run: npm run eval:trajectory

      - name: Run planner eval (mock)
        if: ${{ !cancelled() }}
        run: npm run eval:planner -- --provider mock

      - name: Run recovery observability eval
        if: ${{ !cancelled() }}
        run: npm run eval:recovery-observability

      - name: Run feedback regression eval
        if: ${{ !cancelled() }}
        run: npm run eval:feedback

      - name: Check current quality gate
        if: ${{ !cancelled() }}
        run: npm run quality:current -- --target-commit "$EVAL_TARGET_COMMIT_SHA"

      - name: Upload current quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-quality-${{ env.EVAL_TARGET_COMMIT_SHA }}
          path: |
            server/evaluation/results/latest-quality.*
            server/evaluation/results/latest-feedback.*
            server/evaluation/results/latest-trajectory.*
            server/evaluation/results/latest-planner-mock.*
            server/evaluation/results/latest-recovery-observability.*
            server/evaluation/results/latest-current-quality-gate.*
          if-no-files-found: error
