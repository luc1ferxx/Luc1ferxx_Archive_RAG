name: Real Model Eval

# Real-model evaluation on a CPU runner, with no API key: Ollama serves
# nomic-embed-text and a local chat model, the same stack the numbers in
# server/docs/interview/CURRENT-TRUTH.md were measured on.
#   - verify:quality: the 18 end-to-end checks against a real model (blocking);
#   - QASPER dev evidence recall on a fixed 200-question sample (blocking below
#     the floor; 0.655 when the floor was set);
#   - a probe that the endpoint honours the answer output limit: one request
#     with a limit of 8 tokens must stop for length (blocking, before the
#     answer sample);
#   - QASPER dev answers on a small sample (report only: a 7B model on a CPU
#     runner answers about one question a minute), under the answer-side
#     protocol: temperature 0 with the 1024-token answer limit.

on:
  workflow_dispatch:
    inputs:
      chat_model:
        description: Ollama chat model
        default: qwen2.5:7b
      qasper_answer_cases:
        description: QASPER dev questions to answer (0 skips the answer eval)
        default: "40"
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OLLAMA_MODELS: /home/runner/.ollama/models
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      OPENAI_API_KEY: ollama
      OPENAI_CHAT_MODEL: ${{ inputs.chat_model || 'qwen2.5:7b' }}
      OPENAI_EMBEDDING_MODEL: nomic-embed-text
      RAG_EMBEDDING_DIMENSIONS: "768"
      # CPU inference: one answer can take minutes.
      RAG_LLM_REQUEST_TIMEOUT_MS: "600000"
      VECTOR_STORE_PROVIDER: local
      POSTGRES_DATABASE_URL: ""
      LONG_MEMORY_DATABASE_URL: ""
      RAG_LONG_MEMORY_ENABLED: "false"
      SESSION_MEMORY_STORE_PROVIDER: memory
      QASPER_ANSWER_CASES: ${{ inputs.qasper_answer_cases || '40' }}

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Cache Ollama models
        uses: actions/cache@v6
        with:
          path: /home/runner/.ollama/models
          key: ollama-models-${{ env.OPENAI_CHAT_MODEL }}-nomic-embed-text

      - name: Install and start Ollama
        env:
          # Pinned so a new Ollama release cannot change results or break the
          # job without a commit; bump it on purpose.
          OLLAMA_VERSION: 0.40.3
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/ollama-install.sh" https://ollama.com/install.sh
          for attempt in 1 2 3; do sh "$RUNNER_TEMP/ollama-install.sh" && break; [ "$attempt" = 3 ] && exit 1; sleep 30; done
          # The installer starts a system service with its own model store;
          # serve as the runner user instead so the model cache above applies.
          sudo systemctl stop ollama || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null || { tail -n 50 "$RUNNER_TEMP/ollama.log"; exit 1; }
          # A restored cache already holds both models, so the registry is
          # needed only on a cache miss; retry it there rather than fail.
          ollama show nomic-embed-text > /dev/null 2>&1 || for attempt in 1 2 3; do ollama pull nomic-embed-text && break; [ "$attempt" = 3 ] && exit 1; sleep 30; done
          ollama show "$OPENAI_CHAT_MODEL" > /dev/null 2>&1 || for attempt in 1 2 3; do ollama pull "$OPENAI_CHAT_MODEL" && break; [ "$attempt" = 3 ] && exit 1; sleep 30; done

      - name: Real-model quality verification
        run: npm run verify:quality

      - name: Fetch and convert QASPER dev
        run: |
          mkdir -p evaluation/generated/qasper
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/qasper.tgz" https://qasper-dataset.s3.us-west-2.amazonaws.com/qasper-train-dev-v0.3.tgz
          tar -xzf "$RUNNER_TEMP/qasper.tgz" -C evaluation/generated/qasper
          npm run corpus:qasper -- --input evaluation/generated/qasper/qasper-dev-v0.3.json --papers all --output evaluation/generated/qasper-dev.json

      - name: QASPER evidence recall
        run: npm run eval:qasper-retrieval -- --corpus evaluation/generated/qasper-dev.json --cases 200 --min-hit-at-all 0.6

      - name: Check the answer output limit
        if: env.QASPER_ANSWER_CASES != '0'
        # The answer step's limit holds only if Ollama honours the field it
        # travels in (0.34.4 honours max_tokens and ignores
        # max_completion_tokens), so every run checks the version pinned
        # above: one request with a limit of 8 tokens must stop for length
        # within 8. Otherwise the job fails here, in seconds, before a greedy
        # reply can run to the request timeout.
        run: npm run probe:output-limit

      - name: QASPER answers
        if: env.QASPER_ANSWER_CASES != '0'
        env:
          # The answer-side protocol since 2026-11-10 (docs/evaluation.md
          # "答案温度 0 重测：带输出上限"): greedy decoding, so two runs of one
          # setting answer alike, and an output limit, without which one
          # question once generated until every retry timed out. Only this
          # step: verify:quality above keeps the endpoint default.
          RAG_ANSWER_TEMPERATURE: "0"
          RAG_ANSWER_MAX_TOKENS: "1024"
        run: npm run eval:qasper-answers -- --corpus evaluation/generated/qasper-dev.json --cases "$QASPER_ANSWER_CASES"

      - name: Upload real-model reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-model-eval
          if-no-files-found: warn
          path: |
            server/evaluation/results/latest-doccompare-verification.*
            server/evaluation/results/latest-qasper-retrieval*
            server/evaluation/results/latest-qasper-answers*
