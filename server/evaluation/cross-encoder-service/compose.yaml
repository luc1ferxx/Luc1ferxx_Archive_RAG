# Standalone measured reranker for local evaluation runs, published on
# http://127.0.0.1:8081/rerank (`npm run rerank:cross-encoder:docker` from
# server/). The one-click deployment uses the root docker-compose.yml
# "rerank" profile with compose.rerank.yml instead; both build the same
# image from ./Dockerfile.
services:
  reranker:
    build:
      context: ..
      dockerfile: cross-encoder-service/Dockerfile
    image: luc1ferxx-archive-reranker:local
    environment:
      RAG_CROSS_ENCODER_MODEL: ${RAG_CROSS_ENCODER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_CROSS_ENCODER_MAX_LENGTH: ${RAG_CROSS_ENCODER_MAX_LENGTH:-384}
      RAG_CROSS_ENCODER_BATCH_SIZE: ${RAG_CROSS_ENCODER_BATCH_SIZE:-8}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # Same cache as `npm run rerank:cross-encoder`, so a model downloaded
      # there is not fetched again.
      - ../generated/huggingface:/models/huggingface
