# Local PostgreSQL 16 with the pgvector extension -- the default retrieval
# backend (VECTOR_STORE_PROVIDER=pgvector). Start with `docker compose up -d`
# from the repo root; server/.env.example already points POSTGRES_DATABASE_URL
# at this instance. Data persists in the named volume across restarts.
#
# One-click deployment of the whole app (docs/deployment.md):
#   docker compose --profile app up -d --build
# serves the UI and API on http://localhost:5001 next to this PostgreSQL. Add
# `--profile layout` (and PDF_PARSER=docling) for Docling layout parsing, and
# `-f docker-compose.yml -f compose.rerank.yml --profile rerank` for the
# cross-encoder reranker.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: luc1ferxx-archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional shared state for multi-instance deployments (RAG_SHARED_STATE=redis):
  # circuit breakers, the model concurrency cap and the claim-judge cache.
  # Not started by default; run `docker compose --profile shared-state up -d`.
  redis:
    image: redis:7-alpine
    container_name: luc1ferxx-archive-redis
    restart: unless-stopped
    profiles: ["shared-state"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The API server with the built frontend (Dockerfile). Model endpoints and
  # keys come from server/.env when it exists; the database settings below
  # point it at the postgres service. For Ollama on the host, set
  # OPENAI_BASE_URL=http://host.docker.internal:11434/v1.
  app:
    build: .
    image: luc1ferxx-archive-rag:local
    container_name: luc1ferxx-archive-app
    restart: unless-stopped
    profiles: ["app"]
    env_file:
      - path: server/.env
        required: false
    environment:
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentai
      LONG_MEMORY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentai
      VECTOR_STORE_PROVIDER: pgvector
      PDF_PARSER: ${PDF_PARSER:-pdfjs}
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling:5001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/data

  # Optional layout-aware PDF parsing (PDF_PARSER=docling): tables as cell
  # grids and multi-column reading order. About 2 GB compressed, CPU only.
  # Run `PDF_PARSER=docling docker compose --profile app --profile layout up -d`.
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    container_name: luc1ferxx-archive-docling
    restart: unless-stopped
    profiles: ["layout"]
    ports:
      - "5010:5001"

  # Optional cross-encoder reranker, the one measured in docs/evaluation.md:
  # server/evaluation/neural-cross-encoder-endpoint.py with the pinned
  # neural-reranker-requirements.txt and BAAI/bge-reranker-v2-m3, on CPU. It
  # returns raw logits. compose.rerank.yml points the app at it; this profile
  # alone changes nothing in the app. The model cache is the same directory
  # `npm run rerank:cross-encoder` uses; a fresh machine downloads about 2.3 GB
  # into it on first start. Run
  # `docker compose -f docker-compose.yml -f compose.rerank.yml --profile app --profile rerank up -d --build`.
  reranker:
    build:
      context: server/evaluation
      dockerfile: cross-encoder-service/Dockerfile
    image: luc1ferxx-archive-reranker:local
    container_name: luc1ferxx-archive-reranker
    restart: unless-stopped
    profiles: ["rerank"]
    environment:
      RAG_CROSS_ENCODER_MODEL: ${RAG_CROSS_ENCODER_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      - ./server/evaluation/generated/huggingface:/models/huggingface

volumes:
  pgdata:
  appdata:
